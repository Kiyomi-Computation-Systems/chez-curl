# Test fixture: a workflow whose setup-node takes its version from a step's output.
name: Fixture
on:
  pull_request:
jobs:
  floor:
    runs-on: ubuntu-24.04
    steps:
      - name: Name the Node floor
        id: node
        run: echo "version=$(scripts/ci/floor.sh node)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@0000000000000000000000000000000000000000 # v0.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: make test
